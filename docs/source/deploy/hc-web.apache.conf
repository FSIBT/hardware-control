# Apache as TLS-terminating reverse proxy for hc_web (gunicorn on 127.0.0.1:8000).
#
# Modules: a2enmod proxy proxy_http headers ssl rewrite
# Certificate: see the web monitor page of the documentation (Let's Encrypt).

<VirtualHost *:80>
    ServerName monitor.example.org
    RewriteEngine On
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName monitor.example.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/monitor.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/monitor.example.org/privkey.pem

    # hc_web trusts X-Forwarded-For/-Proto/-Host from exactly one proxy
    # (config proxy_hops). mod_proxy_http adds -For and -Host itself.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
