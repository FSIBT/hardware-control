[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware-control"
dynamic = ["version"]
authors = [
   { name = "Arun Persaud", email = "apersaud@lbl.gov" },
   { name = "Ariel Amsellem", email = "ajamsellem@lbl.gov" },
   { name = "Brian Mak", email = "brianmak@lbl.gov" },
   { name = "Mauricio Ayllon Unzueta", email = "mayllonu@lbl.gov" },
   { name = "Brian Wynne", email = "bwynne@lbl.gov" },
   { name = "Grant Giesbrecht", email = "ggiesbrecht@lbl.gov" },
   { name = "Timo Bauer", email = "TimoBauer@lbl.gov" },
   { name = "Zhihao Qin", email = "zqin@lbl.gov" },
   { name = "Arfon Smith", email = "arfon.smith@gmail.com" },
   { name = "Sara Matsuo Saib", email = "smsaib@lbl.gov" },
   { name = "Caroline Egan", email = "cegan@lbl.gov" },
   { name = "Schuyler Freeman", email = "skyfreeman@lbl.gov" },
]
readme = "README.md"
license = "BSD-3-Clause-LBNL"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "docopt-ng",
    "matplotlib",
    "nidaqmx >= 0.6.4",
    "numpy",
    "pandas",
    "picoscope",
    "platformdirs >= 4.0.0",
    "psutil >= 5.9.0",
    "pymodbus >= 3.0.0",
    "PyQt6",
    "pyqtgraph",
    "pyvisa",
    "pyserial",
    "pyusb",
    "qtconsole >= 5.3.2",
    "rich",
    "scipy",
    "setproctitle",
    "vortran_lbl",
    "pyzmq",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
mcp = ["mcp >= 0.9.0"]
test = [
    "pytest >= 7.0.0",
    "pytest-benchmark >= 5.0.0",
]
docs = [
    "Sphinx >= 4.0.0",
    "recommonmark",
    "sphinx_rtd_theme",
]
dev = [
    "pytest >= 7.0.0",
    "pytest-benchmark >= 5.0.0",
    "Sphinx >= 4.0.0",
    "recommonmark",
    "sphinx_rtd_theme",
    "ruff",
    "setuptools",
    "setuptools-scm",
]

[project.scripts]
hc-query = "hardware_control.cli.hc_query:main"
hc-mcp = "hardware_control.cli.hc_mcp:main"

[project.urls]
documentation = "https://hardware-control.readthedocs.io/"
homepage = "https://bitbucket.org/berkeleylab/hardware-control"
issues = "https://bitbucket.org/berkeleylab/hardware-control/issues"
changelog = "https://bitbucket.org/berkeleylab/hardware-control/src/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["icons/*svg"]

[tool.setuptools_scm]
write_to = "src/hardware_control/_version.py"

[tool.coverage.run]
branch = true
source = ["src/hardware_control", "tests"]

[tool.coverage.report]
skip_covered = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["E741"]
select = ["UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 80

