pipelines:
  default:
    - parallel:
      - step:
          name: Test_3.11
          image: python:3.11
          caches:
            - pip
          script:
            - apt-get update -y
            - apt-get install -y xvfb libxkbcommon0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libegl1 libglx-mesa0 libglib2.0-0 libdbus-1-3 libpulse0
            - pip install -U pip
            - pip install .
            - DISPLAY=:99 xvfb-run --auto-servernum pytest -v tests/* --junitxml=test-reports/report.xml
