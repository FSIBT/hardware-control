pipelines:
  default:
    - parallel:
      - step:
          name: Test_3.11
          image: python:3.11
          caches:
            - pip
          script:
            - apt-get update -y
            - apt-get install -y python3-pyqt6 mesa-common-dev libglu1-mesa-dev libpulse0 libpulse-mainloop-glib0
            - pip install -U pip
            - pip install .
            - pytest -v tests/* --junitxml=test-reports/report.xml
      - step:
          name: Test_3.12
          image: python:3.12
          caches:
            - pip
          script:
            - apt-get update -y
            - apt-get install -y python3-pyqt6 mesa-common-dev libglu1-mesa-dev libpulse0 libpulse-mainloop-glib0
            - pip install -U pip
            - pip install .
            - pytest -v tests/* --junitxml=test-reports/report.xml
      - step:
          name: Test_3.13
